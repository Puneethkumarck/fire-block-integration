server:
  port: 8080

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

spring:
  application:
    name: custody-fireblocks
  datasource:
    url: jdbc:postgresql://localhost:5432/custody
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      observation-enabled: true
    consumer:
      group-id: custody-fireblocks
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      observation-enabled: true
      properties:
        spring.json.trusted.packages: com.stablecoin.custody.fireblocks.domain.event
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZITADEL_ISSUER_URI:http://localhost:8085}

rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration: 1m

fireblocks:
  api:
    base-url: ${FIREBLOCKS_API_URL:https://sandbox-api.fireblocks.io}
    connect-timeout: 5s
    read-timeout: 30s
  secrets:
    private-key-name: fireblocks/private-key
    api-key-name: fireblocks/api-key
    webhook-public-key-name: fireblocks/webhook-public-key

aws:
  secretsmanager:
    endpoint: ${AWS_SECRETSMANAGER_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}

namastack:
  outbox:
    poll-interval: 500
    batch-size: 20
    jdbc:
      table-prefix: "custody_"
      schema-initialization:
        enabled: false
    retry:
      policy: exponential
      max-retries: 5
      exponential:
        initial-delay: 1000
        max-delay: 60000
        multiplier: 2.0

resilience4j:
  bulkhead:
    bulkheadAspectOrder: 1
    instances:
      fireblocks:
        maxConcurrentCalls: 25
  circuitbreaker:
    circuitBreakerAspectOrder: 2
    instances:
      fireblocks:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 60
        slowCallDurationThreshold: 10s
      fireblocks-balance:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
  retry:
    retryAspectOrder: 3
    instances:
      fireblocks:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - com.stablecoin.custody.fireblocks.domain.shared.CustodyException

custody:
  polling:
    interval: 120000
    vault-interval: 120000
