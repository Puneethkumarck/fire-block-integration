server:
  port: 8080

management:
  server:
    port: 8082
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

spring:
  application:
    name: custody-fireblocks
  datasource:
    url: jdbc:postgresql://localhost:5432/custody
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZITADEL_ISSUER_URI:http://localhost:8085}

rate-limit:
  capacity: 100
  refill-tokens: 100
  refill-duration: 1m

fireblocks:
  api:
    base-url: ${FIREBLOCKS_API_URL:https://sandbox-api.fireblocks.io}
    connect-timeout: 5s
    read-timeout: 30s
  secrets:
    private-key-name: fireblocks/private-key
    api-key-name: fireblocks/api-key
    webhook-public-key-name: fireblocks/webhook-public-key

aws:
  secretsmanager:
    endpoint: ${AWS_SECRETSMANAGER_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
