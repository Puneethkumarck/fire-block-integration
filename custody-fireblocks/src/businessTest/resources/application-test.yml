spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085
  kafka:
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.stablecoin.custody.fireblocks.domain.event

server:
  port: 0

management:
  server:
    port: -1

namastack:
  outbox:
    poll-interval: 100
    batch-size: 20
    jdbc:
      table-prefix: "custody_"
      schema-initialization:
        enabled: false
