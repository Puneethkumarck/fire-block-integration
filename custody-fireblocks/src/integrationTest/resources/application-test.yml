spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085
  kafka:
    consumer:
      auto-offset-reset: earliest

server:
  port: 0

management:
  server:
    port: -1

fireblocks:
  secrets:
    private-key-name: fireblocks/private-key
    api-key-name: fireblocks/api-key
    webhook-public-key-name: fireblocks/webhook-public-key
